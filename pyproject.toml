[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-audit"
version = "0.1.0"
description = "Aegis AI Safety & Regulatory Compliance Auditor (Multi-Agent + BYOM + Zero False Negatives)"
authors = [
    { name = "Aegis Audit Team" }
]
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "typer",
    "rich",
    "weasyprint",
    "pydantic>=2.0",
    "langgraph",
    "openai",
    "tree-sitter",
    "tree-sitter-python",
    "rank-bm25",
    "pygithub",
    "beautifulsoup4",
    "html2text",
    "linkup-sdk",
    "pymongo",
    "langgraph-checkpoint-mongodb",
    "databricks-sdk",
    "mlflow",
    "apscheduler>=3.10,<4",
    "httpx",
    "pytest",
    "pypdf",
    "pdfplumber",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mongomock",
    "pyyaml",
]
browser = ["playwright"]

[project.scripts]
aegis = "aegis_audit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis_audit*", "sample_connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
