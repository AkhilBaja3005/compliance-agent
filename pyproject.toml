[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphite-audit"
version = "0.1.0"
description = "Graphite AI Safety & Regulatory Compliance Auditor (Multi-Agent + BYOM + Zero False Negatives)"
authors = [
    { name = "Graphite Audit Team" }
]
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "typer",
    "rich",
    "weasyprint",
    "pydantic>=2.0",
    "langgraph",
    "openai",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-language-pack",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "pyarrow",
    "pyyaml",
    "rank-bm25",
    "pygithub",
    "beautifulsoup4",
    "html2text",
    "linkup-sdk",
    "pymongo",
    "langgraph-checkpoint-mongodb",
    "databricks-sdk",
    "mlflow",
    "apscheduler>=3.10,<4",
    "httpx",
    "pytest",
    "pypdf",
    "pdfplumber",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mongomock",
    "pyyaml",
    "ruff",
    "pip-audit",
]
ocr = [
    "pytesseract",
]
browser = ["playwright"]

[project.scripts]
graphite = "graphite_audit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphite_audit*", "sample_connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
ignore = ["F401"]
