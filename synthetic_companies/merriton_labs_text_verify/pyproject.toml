[project]
name = "demotext-verify"
version = "0.1.0"
description = "Synthetic editorial classifier product; local inference is simulation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4", "pydantic>=2.9,<3", "boto3>=1.35,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
