name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN is not set in GitHub repository settings!"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a clean deployment branch for Hugging Face without binary assets
          git checkout -b hf-deploy

          # Remove binary files that Hugging Face Spaces rejects via pre-receive hook
          git rm -rf --ignore-unmatch \
            assets/*.png assets/*.jpg assets/*.jpeg \
            *.pdf reports/*.pdf \
            regulatory_pdfs/*.pdf

          # Ensure Dockerfile and README have HF-specific frontmatter & config
          if ! grep -q "app_port: 8000" README.md; then
            cat << 'EOF' > /tmp/hf_readme_header.txt
          ---
          title: Graphite AI Safety & Regulatory Compliance Auditor
          emoji: ⚖️
          colorFrom: indigo
          colorTo: gray
          sdk: docker
          app_port: 8000
          pinned: false
          ---

          EOF
            cat /tmp/hf_readme_header.txt README.md > /tmp/new_readme.md
            mv /tmp/new_readme.md README.md
            git add README.md
          fi

          git commit -m "deploy: sync clean source tree to Hugging Face Spaces" || true

          git remote add hf "https://abaja:${HF_TOKEN}@huggingface.co/spaces/abaja/graphite"
          git push hf hf-deploy:main --force

      - name: Trigger Hugging Face Factory Rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Triggering Hugging Face factory rebuild to invalidate Docker caches..."
          status_code=$(curl -s -o /tmp/hf_restart_response.json -w "%{http_code}" -X POST "https://huggingface.co/api/spaces/abaja/graphite/restart?factory=true" \
            -H "Authorization: Bearer ${HF_TOKEN}")
          echo "Hugging Face restart API responded with HTTP: $status_code"
          cat /tmp/hf_restart_response.json
          if [ "$status_code" -ne 200 ]; then
            echo "::warning::Hugging Face restart API returned HTTP $status_code"
          fi
