services:
  graphite:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      GRAPHITE_DATA_DIR: /var/lib/graphite
      GRAPHITE_DASHBOARD_DB: /var/lib/graphite/dashboard.sqlite3
      GRAPHITE_HISTORY_FILE: /var/lib/graphite/finding-history.json
    volumes:
      - graphite-data:/var/lib/graphite
      - ./synthetic_companies:/app/companies:ro
    restart: unless-stopped
  sync:
    build: .
    command: ["graphite", "sync-daemon", "--interval-hours", "24", "--config", "/app/sync_sources.yaml"]
    env_file: [.env]
    volumes:
      - ./sync_sources.yaml:/app/sync_sources.yaml:ro
      - ./regulatory_pdfs:/app/regulatory_pdfs:ro
    restart: unless-stopped
volumes:
  graphite-data:
