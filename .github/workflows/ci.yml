name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (includes the precision/recall eval gate)
        run: python -m pytest -q
        env: { BYOM_OFFLINE: "true" }
      - name: Eval table
        run: aegis eval
        env: { BYOM_OFFLINE: "true" }
      - name: Dependency vulnerabilities
        run: pip-audit
        continue-on-error: true
